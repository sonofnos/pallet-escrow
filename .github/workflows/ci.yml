name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Unit tests
        run: cargo test -p pallet-escrow -p pallet-escrow-v1
      - name: Benchmarks execute, migration hooks build
        run: cargo test -p pallet-escrow --features runtime-benchmarks,try-runtime
      - name: Spec-oracle harness (v2 and v1 must pass, v0 findings must be rediscovered, migration keeps state)
        run: cargo test -p escrow-harness --release -- --nocapture --test-threads=1
        env:
          # Keep debug assertions on so arithmetic overflow panics instead of wrapping.
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
          HARNESS_SEEDS: "20000"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features pallet-escrow/runtime-benchmarks,pallet-escrow/try-runtime -- -D warnings
        env:
          # Type-check the benchmark runtime natively; the `weights` job builds its wasm.
          SKIP_WASM_BUILD: 1

  hunt-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: v0 with overflow checks (how tests see it)
        run: |
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true \
            cargo run --release -q -p escrow-harness --example hunt -- v0 20000 | tee hunt-v0-checked.txt
      - name: v0 as a production runtime runs it (overflow wraps)
        run: cargo run --release -q -p escrow-harness --example hunt -- v0 20000 | tee hunt-v0-wrapping.txt
      - name: v1 (hold-based)
        run: cargo run --release -q -p escrow-harness --example hunt -- v1 50000 | tee hunt-v1.txt
      - name: v2 (the pallet)
        run: cargo run --release -q -p escrow-harness --example hunt -- v2 50000 | tee hunt-v2.txt
      - name: Proofs of concept (release build, as a runtime is built)
        run: cargo run --release -q -p escrow-harness --example poc | tee poc.txt
      - run: |
          { echo '```'; cat poc.txt; echo '```'; echo '```'; cat hunt-v0-checked.txt; echo '```'; echo '```'; head -40 hunt-v0-wrapping.txt; echo '```'; echo '```'; cat hunt-v1.txt; echo '```'; echo '```'; cat hunt-v2.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hunt-reports
          path: |
            hunt-*.txt
            poc.txt

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz hardened pallet (must not crash)
        run: cd fuzz && cargo fuzz run escrow -- -max_total_time=300 -max_len=4096
      - name: Fuzz v0 (must crash)
        run: |
          set -o pipefail
          cd fuzz
          if cargo fuzz run escrow_v0 -- -max_total_time=120 -max_len=4096 2>&1 | tee v0.log; then
            echo "expected libFuzzer to find a violation in v0"; exit 1
          fi
          grep -m1 -A3 "panicked" v0.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  weights:
    runs-on: ubuntu-latest
    env:
      BENCHER: https://github.com/paritytech/polkadot-sdk/releases/download/polkadot-stable2606-2/frame-omni-bencher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark runtime (wasm)
        run: cargo build --release -p escrow-bench-runtime --features runtime-benchmarks
      - name: frame-omni-bencher from the stable2606 release
        run: |
          curl -sSfLO "$BENCHER" && curl -sSfLO "$BENCHER.sha256"
          sha256sum -c frame-omni-bencher.sha256 && chmod +x frame-omni-bencher
      - name: Every benchmark runs; weights regenerated on this runner
        run: |
          ./frame-omni-bencher v1 benchmark pallet             --runtime target/release/wbuild/escrow-bench-runtime/escrow_bench_runtime.compact.compressed.wasm             --pallet pallet_escrow --extrinsic '*' --steps 50 --repeat 20             --template .maintain/frame-weight-template.hbs --header .maintain/weights-header.txt             --output weights.rs
      - uses: actions/upload-artifact@v4
        with:
          name: weights
          path: weights.rs

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Pallets build for the runtime target without std
        run: cargo check -p pallet-escrow -p pallet-escrow-v1 --no-default-features --target wasm32v1-none

  frame-sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --git https://github.com/sonofnos/frame-sentinel
      - name: Hardened pallets must have no findings at medium or above
        run: |
          frame-sentinel pallets/escrow --fail-on medium
          frame-sentinel pallets/escrow-v1 --fail-on medium
      - name: Audit target (report only)
        run: frame-sentinel pallets/escrow-v0 --fail-on never | tee -a "$GITHUB_STEP_SUMMARY"
